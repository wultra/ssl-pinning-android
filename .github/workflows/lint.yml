name: Lint

on:
  push:
    branches:
      - develop
      - releases/*
  pull_request:

jobs:
  ktlint:
    name: ktlint
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Run lint script
        run: ./scripts/lint.sh

  androidLint:
    name: Android Lint
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Android Lint
        run: ./gradlew library:lint
      - name: Upload Android Lint results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results-debug
          path: library/build/reports/lint-results-debug.html
          retention-days: 5
