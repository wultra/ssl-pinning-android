name: Build

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  buildJob:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Assemble Library
        run: ./gradlew library:assemble
