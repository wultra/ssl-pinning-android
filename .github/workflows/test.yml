name: Tests

on:
  pull_request:

jobs:
  unitTests:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare tests
        run: sh ./scripts/prepare-tests.sh --url ${{ secrets.SSL_PINNING_TEST_BASE_URL }} --app ${{ secrets.SSL_PINNING_TEST_APP_NAME }} --username ${{ secrets.SSL_PINNING_TEST_ADMIN_USERNAME }} --password ${{ secrets.SSL_PINNING_TEST_ADMIN_PASSWORD }}
      - name: Unit Test
        run: ./gradlew library:test

  intrTests:
    name: Instrumentation Tests
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare tests
        run: sh ./scripts/prepare-tests.sh --url ${{ secrets.SSL_PINNING_TEST_BASE_URL }} --app ${{ secrets.SSL_PINNING_TEST_APP_NAME }} --username ${{ secrets.SSL_PINNING_TEST_ADMIN_USERNAME }} --password ${{ secrets.SSL_PINNING_TEST_ADMIN_PASSWORD }}
      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew library:connectedAndroidTest