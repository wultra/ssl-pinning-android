name: Tests

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  unitTests:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare tests
        run: ./scripts/prepare-tests.sh --url ${{ secrets.SSL_PINNING_TEST_BASE_URL }} --app ${{ secrets.SSL_PINNING_TEST_APP_NAME }} --username ${{ secrets.SSL_PINNING_TEST_ADMIN_USERNAME }} --password ${{ secrets.SSL_PINNING_TEST_ADMIN_PASSWORD }}
      - name: Unit Test
        run: ./gradlew library:test
      - name: Upload unit test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-debug
          path: library/build/reports/tests/testDebugUnitTest/
          retention-days: 5

  intrTests:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare tests
        run: ./scripts/prepare-tests.sh --url ${{ secrets.SSL_PINNING_TEST_BASE_URL }} --app ${{ secrets.SSL_PINNING_TEST_APP_NAME }} --username ${{ secrets.SSL_PINNING_TEST_ADMIN_USERNAME }} --password ${{ secrets.SSL_PINNING_TEST_ADMIN_PASSWORD }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew library:connectedAndroidTest --info
      - name: Upload instrumentation test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results-debug
          path: library/build/reports/androidTests/connected/
          retention-days: 5